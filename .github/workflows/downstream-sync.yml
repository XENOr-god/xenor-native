name: Trigger xenor-web Submodule Sync

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read

jobs:
  dispatch-xenor-web:
    name: Dispatch xenor-web submodule sync
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Verify sync token is configured
        env:
          XENOR_SYNC_TOKEN: ${{ secrets.XENOR_SYNC_TOKEN }}
        run: |
          if [[ -z "${XENOR_SYNC_TOKEN}" ]]; then
            echo "::error::Missing XENOR_SYNC_TOKEN in xenor-native. Configure a token that can dispatch workflows to XENOr-god/xenor-site."
            exit 1
          fi

      - name: Dispatch sync request to xenor-web
        env:
          XENOR_SYNC_TOKEN: ${{ secrets.XENOR_SYNC_TOKEN }}
          TARGET_REPOSITORY: XENOr-god/xenor-site
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_REF: ${{ github.event.workflow_run.head_branch }}
        run: |
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${XENOR_SYNC_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${TARGET_REPOSITORY}/dispatches" \
            -d @- <<EOF
          {
            "event_type": "xenor-native-sync",
            "client_payload": {
              "sha": "${SOURCE_SHA}",
              "ref": "${SOURCE_REF}",
              "repository": "${SOURCE_REPOSITORY}",
              "commit_url": "https://github.com/${SOURCE_REPOSITORY}/commit/${SOURCE_SHA}"
            }
          }
          EOF
